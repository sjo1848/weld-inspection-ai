[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weld-inspection-ai-ml"
version = "0.1.0"
description = "Python tooling for weld surface-anomaly dataset preparation, training, evaluation, export and parity checks."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "pillow>=10.4,<12",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "ml/src"}

[tool.setuptools.packages.find]
where = ["ml/src"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["ml/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ml/src", "ml/tests", "ml/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
