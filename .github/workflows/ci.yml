name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: B0 bootstrap checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python package and dev tools
        run: python -m pip install -e '.[dev]'

      - name: Run Python tests
        run: pytest

      - name: Run Python lint
        run: ruff check .

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check web workspace
        run: pnpm web:typecheck

      - name: Build web workspace
        run: pnpm web:build

      - name: B1 source API preflight
        run: python ml/scripts/download_dataset.py --list-only
